<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

canvas{display:block;width:100vw;height:100vh}

<canvas id="cv" aria-label="Cinématique d'arrivée sur la planète, en caractères ASCII"></canvas>
<div id="fin" hidden><button id="rej2">▶ Rejouer l'arrivée</button></div>
<div id="ui"><label><select id="pal" aria-label="Palette"></select></label><button id="rej">Rejouer</button></div>
